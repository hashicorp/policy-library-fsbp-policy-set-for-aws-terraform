    type: "sentinel"
  autoscaling-group-should-use-launch-templates:
    path: "policies/autoscaling-group/autoscaling-group-should-use-launch-templates.sentinel"
    governed_resources: ["aws_autoscaling_group"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "Auto Scaling Group"
    description: "This policy checks if resources of type 'aws_autoscaling_group' have the 'launch_template' atribute or the attribute must be present in 'mixed_instances_policy'"
    type: "sentinel"
  autoscaling-group-should-use-multiple-instance-types:
    path: "policies/autoscaling-group/autoscaling-group-should-use-multiple-instance-types.sentinel"
    governed_resources: ["aws_autoscaling_group"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "Auto Scaling Group"
