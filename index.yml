  cloudfront-s3-origin-access-control-enabled:
    path: "policies/cloudfront/cloudfront-s3-origin-access-control-enabled.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "CloudFront"
