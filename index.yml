policies:
  acm-pca-root-ca-disabled:
    path: "policies/acm/acm-pca-root-ca-disabled.sentinel"
    governed_resources: ["aws_acmpca_certificate_authority"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "ACM"
    description: "This policy checks if AWS ACM Private CA has a root certificate authority (CA) that is enabled. The control fails if the root CA is enabled with type 'ROOT'."
    type: "sentinel"
  acm-rsa-certificate-key-length-atleast-2048:
    path: "policies/acm/acm-rsa-certificate-key-length-atleast-2048.sentinel"
    governed_resources: ["aws_acm_certificate"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "ACM"
    description: "This policy requires resources of type `aws_acm_certificate` with rsa key algorithm should have atleast 2048 bits key length."
    type: "sentinel"
  api-gateway-access-logging-should-be-configured:
    path: "policies/api-gateway/api-gateway-access-logging-should-be-configured.sentinel"
    governed_resources: ["aws_apigatewayv2_stage"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "API Gateway"
    description: "This policy checks if 'aws_apigatewayv2_stage' have access logging configured."
    type: "sentinel"
  api-gateway-rest-and-websocket-api-logging-enabled:
    path: "policies/api-gateway/api-gateway-rest-and-websocket-api-logging-enabled.sentinel"
    governed_resources: ["aws_api_gateway_method_settings"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "API Gateway"
    description: "This policy checks for resource type of 'aws_api_gateway_method_settings' whether all stages of an Amazon API Gateway REST or WebSocket API have logging enabled."
    type: "sentinel"
  api-gateway-rest-cache-have-encryption-enabled:
    path: "policies/api-gateway/api-gateway-rest-cache-have-encryption-enabled.sentinel"
    governed_resources: ["aws_api_gateway_method_settings"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "API Gateway"
    description: "This policy checks 'aws_api_gateway_method_settings' in API Gateway REST API stages that have cache enabled are encrypted."
    type: "sentinel"
  api-gateway-rest-configure-ssl-certificates:
    path: "policies/api-gateway/api-gateway-rest-configure-ssl-certificates.sentinel"
    governed_resources: ["aws_api_gateway_stage"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "API Gateway"
    description: "This policy checks whether 'aws_api_gateway_stage' have SSL certificates configured."
    type: "sentinel"
  api-gateway-rest-have-x-ray-tracing-enabled:
    path: "policies/api-gateway/api-gateway-rest-have-x-ray-tracing-enabled.sentinel"
    governed_resources: ["aws_api_gateway_stage"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "API Gateway"
    description: "This policy checks whether AWS X-Ray active tracing is enabled for your resource 'aws_api_gateway_stage'."
    type: "sentinel"
  api-gateway-routes-should-specify-an-authorization-type:
    path: "policies/api-gateway/api-gateway-routes-should-specify-an-authorization-type.sentinel"
    governed_resources: ["aws_apigatewayv2_route"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "API Gateway"
    description: "This policy checks if 'aws_apigatewayv2_route' have an authorization type."
    type: "sentinel"
  api-gateway-should-be-associated-with-a-waf-web-acl:
    path: "policies/api-gateway/api-gateway-should-be-associated-with-a-waf-web-acl.sentinel"
    governed_resources: ["aws_wafv2_web_acl_association"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "API Gateway"
    description: "This policy checks whether an 'aws_api_gateway_stage' uses 'aws_wafv2_web_acl_association'."
    type: "sentinel"
  appsync-cache-should-be-encrypted-at-transit:
    path: "policies/appsync/appsync-cache-should-be-encrypted-at-transit.sentinel"
    governed_resources: ["aws_appsync_api_cache"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "AppSync"
    description: "This policy requires resources of type `aws_appsync_api_cache` have attribute `transit_encryption_enabled` should be `true`."
    type: "sentinel"
  appsync-field-level-logging-should-be-enabled:
    path: "policies/appsync/appsync-field-level-logging-should-be-enabled.sentinel"
    governed_resources: ["aws_appsync_graphql_api"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "AppSync"
    description: "This policy requires resources of type `aws_appsync_graphql_api` have attribute `log_config` with `field_log_level` set to `ERROR` or `ALL`."
    type: "sentinel"
  appsync-graphql-api-should-not-authenticate-with-api-keys:
    path: "policies/appsync/appsync-graphql-api-should-not-authenticate-with-api-keys.sentinel"
    governed_resources: ["aws_appsync_graphql_api"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "AppSync"
    description: "This policy requires resources of type `aws_appsync_graphql_api` have attribute `authentication_type` should not be `API_KEY`."
    type: "sentinel"
  appsync-graphqlapi-cache-should-be-encrypted-at-rest:
    path: "policies/appsync/appsync-graphqlapi-cache-should-be-encrypted-at-rest.sentinel"
    governed_resources: ["aws_appsync_api_cache", "aws_appsync_graphql_api"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "AppSync"
    description: "This policy requires resources of type `aws_appsync_api_cache` should have 'at_rest_encryption_enabled' should be set to true and 'api_id' should be referenced to `aws_appsync_graphql_api` resource."
    type: "sentinel"
  athena-workgroup-should-have-logging-enabled:
    path: "policies/athena/athena-workgroup-should-have-logging-enabled.sentinel"
    governed_resources: ["aws_athena_workgroup"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "Athena"
    description: "This policy requires resources of type `aws_athena_workgroup` have attribute `publish_cloudwatch_metrics_enabled` should be `true`."
    type: "sentinel"
  aurora-postgresql-db-clusters-should-publish-logs-to-cloudwatch-logs:
    path: "policies/rds/aurora-postgresql-db-clusters-should-publish-logs-to-cloudwatch-logs.sentinel"
    governed_resources: ["aws_rds_cluster"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "RDS"
    description: "This control checks whether an Amazon Aurora PostgreSQL DB cluster is configured to publish logs to Amazon CloudWatch Logs."
    type: "sentinel"
  autoscaling-group-should-cover-multiple-azs:
    path: "policies/autoscaling-group/autoscaling-group-should-cover-multiple-azs.sentinel"
    governed_resources: ["aws_autoscaling_group"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "Auto Scaling Group"
