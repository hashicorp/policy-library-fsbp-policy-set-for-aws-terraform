  cloudfront-distributions-should-have-origin-failover-configured:
    path: "policies/cloudfront/cloudfront-distributions-should-have-origin-failover-configured.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
