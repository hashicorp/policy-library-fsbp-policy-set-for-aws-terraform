  cloudfront-distributions-should-use-sni-to-serve-https-requests:
    path: "policies/cloudfront/cloudfront-distributions-should-use-sni-to-serve-https-requests.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
