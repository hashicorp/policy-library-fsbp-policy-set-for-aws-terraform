  cloudfront-distributions-should-not-use-deprecated-ssl-protocols:
    path: "policies/cloudfront/cloudfront-distributions-should-not-use-deprecated-ssl-protocols.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "AWS FSBP"
    service: "CloudFront"
